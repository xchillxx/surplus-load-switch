# Surplus Load Switch — self-adapting sidebar dashboard
#
# A dedicated dashboard (not just a view) with three tabs: Diagnose,
# Einstellungen and Logs. All three self-adapt to however many devices
# you've configured — add or remove a device in the integration's
# Configure menu and every tab picks it up on its own, no YAML editing
# required. This works by discovering entities through the naming
# patterns this integration always uses, not by hardcoding entity IDs
# per device — nothing in this file needs to be edited for your own
# setup.
#
# Requirements:
# - Surplus Load Switch v1.17.0+ (for the live number/select settings
#   entities the Einstellungen tab is built from).
# - The "auto-entities" custom card from HACS (Frontend section):
#   https://github.com/thomasloven/lovelace-auto-entities
#   The Diagnose tab's Status card needs no extra card (core Home
#   Assistant templating only) — everything else on this page does.
#
# How to use this:
# Settings → Dashboards → "Add Dashboard" → "New dashboard from
# scratch" → give it a name and icon, tick "Show in sidebar" → once
# created, open its three-dot menu → "Edit in YAML" and paste this
# file's content in. It appears as its own entry in the sidebar, with
# Diagnose / Einstellungen / Logs as tabs at the top — no separate view
# to add to an existing dashboard.
#
# Adding a brand-new device still goes through the integration's own
# Configure dialog (a guided multi-step form fits that better than a
# dashboard ever could) — this dashboard is for *watching* and
# *adjusting* devices you've already added.

views:
  - title: Diagnose
    path: diagnose
    icon: mdi:chart-box-outline
    cards:
      - type: vertical-stack
        cards:
          - type: markdown
            title: Status (nach Priorität)
            card_mod:
              style: "ha-markdown { line-height: 1.25 !important; } ha-markdown p { margin-block: 2px !important; }"
            content: >-
              {% set surplus = states('sensor.surplus_load_switch_uberschuss') | float(0) %}
              {% set h_bat = states('sensor.surplus_load_switch_akku_reicht') | float(999) %}
              {% set h_sol = states('sensor.surplus_load_switch_bis_solar_start') | float(0) %}
              {% set modus = states('sensor.surplus_load_switch_modus') %}
              {% set schwach = (states.binary_sensor | selectattr('attributes.soc_zuwachs_heute', 'defined') | list | first) %}
              {% set ns = namespace(rows=[]) %}
              {% for eid in integration_entities('surplus_load_switch') if eid.endswith('_o_leistung') %}
              {% set prio = state_attr(eid, 'prioritaet') | default(99) | float(99) %}
              {% set ns.rows = ns.rows + [(prio, eid)] %}
              {% endfor %}

              {% for prio, eid in ns.rows | sort %}{% set name = (state_attr(eid, 'friendly_name') | default('')).replace(' Ø Leistung', '') %}{% set an = state_attr(eid, 'ist_an') %}{% set soll = state_attr(eid, 'sollte_an_sein') %}{% set korrekt = state_attr(eid, 'korrekt_geschaltet') %}{% set aktiv = state_attr(eid, 'aktiviert') %}{% set cutoff = state_attr(eid, 'naechster_cutoff') %}{% set countdown = state_attr(eid, 'schalt_countdown_s') | default(0, true) | int %}{% set richtung = state_attr(eid, 'schalt_richtung') %}{% set fenster = ' · Zeitfenster bis ' ~ (cutoff | as_datetime | as_local).strftime('%H:%M') if cutoff else '' %}{% if aktiv == false %}⚪ {{ name }} (Prio {{ prio | int }}) deaktiviert{% elif countdown > 0 %}⏳ {{ name }} (Prio {{ prio | int }}) wartet noch {{ (countdown // 60) }}:{{ '%02d' | format(countdown % 60) }} min bis {{ richtung }}{{ fenster }}{% elif korrekt %}{% if an %}🟢 {{ name }} (Prio {{ prio | int }}) läuft korrekt{{ fenster }}{% else %}🔴 {{ name }} (Prio {{ prio | int }}) aus — korrekt{{ fenster }}{% endif %}{% else %}⚠️ {{ name }} (Prio {{ prio | int }}) Abweichung: ist {{ 'AN' if an else 'AUS' }}, sollte {{ 'AN' if soll else 'AUS' }} sein{{ fenster }}{% endif %}<br>
              {% endfor %}

              {{ modus }} · Überschuss {{ surplus | round(2) }} kW · Akku reicht {{ h_bat | round(1) if h_bat < 999 else '∞' }} h vs. bis Solar {{ h_sol | round(1) }} h{% if schwach and schwach.state == 'on' %} · ⚠️ Schwacher Tag (Akku +{{ schwach.attributes.soc_zuwachs_heute | default(0, true) | round(1) }}% von üblich +{{ schwach.attributes.referenz_soc_zuwachs | default(0, true) | round(1) }}%){% endif %}

          - type: entities
            title: Live-Werte (global)
            # Solar-Leistung / Hausverbrauch / Batterie-SOC / Batterie-Leistung
            # below use "attribute" rows on the Überschuss sensor as a safe
            # generic default (works without editing anything) — but tapping
            # them then opens the Überschuss graph, not each value's own
            # history. For a proper history graph per value, replace those
            # four rows' "type: attribute" block with a plain
            # "- entity: <your raw solar/load/soc/battery sensor>" pointing
            # at whichever entity you picked for that field in Einstellungen
            # -> System.
            entities:
              - type: attribute
                entity: sensor.surplus_load_switch_uberschuss
                attribute: solar_kw
                name: Solar-Leistung
                icon: mdi:solar-power
                suffix: " kW"
              - type: attribute
                entity: sensor.surplus_load_switch_uberschuss
                attribute: house_load_kw
                name: Hausverbrauch (gesamt)
                icon: mdi:home-lightning-bolt-outline
                suffix: " kW"
              # Grundlast has its own dedicated entity (PVBaseLoadSensor) so
              # it gets its own recorder history instead of opening
              # Überschuss's graph when tapped — unlike the four raw-sensor
              # rows above, its entity_id isn't fixed/predictable (it was
              # added after this integration switched to has_entity_name,
              # so the id HA generates depends on your own device/area
              # naming). Replace with your own instance's id if it differs
              # (Entwicklerwerkzeuge -> Zustände, search "Grundlast").
              - entity: sensor.technik_abstellraum_sls_grundlast
                name: Grundlast (ohne verwaltete Geräte)
                icon: mdi:home-import-outline
              - entity: sensor.surplus_load_switch_uberschuss
                name: Überschuss (exkl. Wallbox + laufende Geräte)
                icon: mdi:transmission-tower
              - type: attribute
                entity: sensor.surplus_load_switch_uberschuss
                attribute: soc
                name: Batterie-SOC
                icon: mdi:battery
                suffix: " %"
              - type: attribute
                entity: sensor.surplus_load_switch_uberschuss
                attribute: batt_kw
                name: Batterie-Leistung (+ laden / - entladen)
                icon: mdi:battery-charging
                suffix: " kW"
              - entity: sensor.surplus_load_switch_akku_reicht
                name: Akku reicht
                icon: mdi:battery-clock
              - entity: sensor.surplus_load_switch_bis_solar_start
                name: Bis Solar-Start
                icon: mdi:weather-sunset-up
              - entity: sensor.surplus_load_switch_verfugbare_akkukapazitat
                name: Verfügbare Akkukapazität
                icon: mdi:battery-high
              - entity: sun.sun
                name: Sonne über Horizont
                icon: mdi:sun-angle
              # Same reasoning as Grundlast above: PVBattOkBinarySensor is
              # its own dedicated entity so it gets its own history instead
              # of opening Überschuss's graph — id isn't fixed/predictable
              # across installs, replace with yours if it differs.
              - entity: binary_sensor.technik_abstellraum_sls_akku_ausreichend
                name: Akku ausreichend (Nachtmodus OK)
                icon: mdi:battery-check
              - entity: sensor.surplus_load_switch_modus
                name: Modus
                icon: mdi:information-outline
              # "Nächste Prüfung" and "Schwacher Tag" aren't listed here as
              # static rows -- their entity_id depends on your hub
              # device's area assignment and can't be guessed generically
              # the way the others above can. Both are already shown in
              # the Status card above (found dynamically there); add them
              # here too if you want by finding them in Developer Tools ->
              # States (search "nachste_prufung" / "schwacher_tag") and
              # pasting the real entity_id, e.g.:
              # - entity: binary_sensor.YOUR_PREFIX_sls_schwacher_tag
              #   name: Schwacher Tag
              #   icon: mdi:weather-partly-cloudy

      - type: vertical-stack
        cards:
          - type: custom:auto-entities
            card:
              type: entities
              title: Geräte-Übersicht (automatisch)
              show_header_toggle: false
              card_mod:
                style: "#states > div:nth-child(3n):not(:last-child) { border-bottom: 1px solid var(--divider-color); padding-bottom: 8px; margin-bottom: 8px; }"
            filter:
              include:
                - integration: surplus_load_switch
                  entity_id: "sensor.*_o_leistung"
                - integration: surplus_load_switch
                  entity_id: "sensor.*_abschalt_puffer"
                - integration: surplus_load_switch
                  entity_id: "sensor.*_schalt_countdown"
                - integration: surplus_load_switch
                  entity_id: "switch.*_aktiviert"
            sort:
              method: attribute
              attribute: prioritaet
              numeric: true

          - type: custom:auto-entities
            card:
              type: history-graph
              title: Geräte-Verlauf (48h) — wann welches Gerät an/aus war
              hours_to_show: 48
            filter:
              include:
                - integration: surplus_load_switch
                  entity_id: "switch.*_prio_*"
                - integration: surplus_load_switch
                  entity_id: "switch.*_kaskaden_status"
                - integration: surplus_load_switch
                  entity_id: "switch.*_ein_aus"
            sort:
              method: attribute
              attribute: prioritaet
              numeric: true

      - type: vertical-stack
        cards:
          - type: custom:auto-entities
            card:
              type: logbook
              title: Schaltvorgänge (24h, automatisch)
              hours_to_show: 24
            card_param: entities
            filter:
              include:
                - integration: surplus_load_switch
                  entity_id: "switch.*_prio_*"
                - integration: surplus_load_switch
                  entity_id: "switch.*_kaskaden_status"
                - integration: surplus_load_switch
                  entity_id: "switch.*_ein_aus"
            sort:
              method: entity_id

  - title: Einstellungen
    path: einstellungen
    icon: mdi:cog
    cards:
      - type: vertical-stack
        cards:
          - type: heading
            heading: System
            icon: mdi:cog-outline
          - type: custom:auto-entities
            card:
              type: entities
            filter:
              include:
                - integration: surplus_load_switch
                  entity_id: "number.*mindest_soc"
                - integration: surplus_load_switch
                  entity_id: "number.*batteriekapazitat"
                - integration: surplus_load_switch
                  entity_id: "select.*_solar_sensor"
                - integration: surplus_load_switch
                  entity_id: "select.*_last_sensor"
                - integration: surplus_load_switch
                  entity_id: "select.*_soc_sensor"
                - integration: surplus_load_switch
                  entity_id: "select.*_akku_leistungssensor"
            sort:
              method: entity_id

      - type: vertical-stack
        cards:
          - type: heading
            heading: Geräte
            icon: mdi:devices
          - type: markdown
            card_mod:
              style: "ha-markdown { line-height: 1.6 !important; }"
            content: >-
              {% set ns = namespace(rows=[], seen=[]) %}
              {% for eid in integration_entities('surplus_load_switch') if eid.endswith('_o_leistung') %}
              {% set did = device_id(eid) %}
              {% set prio = state_attr(eid, 'prioritaet') | default(99) | float(99) %}
              {% set ns.rows = ns.rows + [(prio, device_attr(did, 'name'), did)] %}
              {% set ns.seen = ns.seen + [did] %}
              {% endfor %}
              {% for eid in integration_entities('surplus_load_switch') if eid.endswith('_wallbox_satisfied_kw') %}
              {% set did = device_id(eid) %}
              {% if did not in ns.seen %}
              {% set ns.rows = ns.rows + [(999, device_attr(did, 'name') ~ ' (Wallbox)', did)] %}
              {% set ns.seen = ns.seen + [did] %}
              {% endif %}
              {% endfor %}

              {% for prio, name, did in ns.rows | sort %}**[{{ name }}{{ ' (Prio ' ~ (prio | int) ~ ')' if prio < 999 else '' }}](/config/devices/device/{{ did }})**<br>
              {% endfor %}

              Klick auf ein Gerät öffnet dessen eigene Seite mit Priorität, Leistung,
              Mindest-Laufzeit, Steuerungs-Entität, Leistungssensor, Zeitplan-Helfer,
              Abhängigkeit und dem Aktiviert-Schalter — alles an einem Ort, direkt bearbeitbar.
              Wallboxen zeigen stattdessen nur die optionale "Ausreichende Ladeleistung"-Schwelle —
              andere Geräte können sie trotzdem als Abhängigkeit nutzen, auch ohne diese zu setzen.

  - title: Logs
    path: logs
    icon: mdi:text-box-outline
    # "panel" instead of the other tabs' "sections" layout: a single card
    # that fills the browser edge-to-edge instead of being capped to a
    # narrow centered column -- a log wants width, not a grid of tiles.
    #
    # A real table (Datum/Gerät/Titel/Details) instead of a logbook card:
    # the coordinator logs every cascade decision every cycle (not just
    # changes) into a rolling in-memory buffer, exposed as the "eintraege"
    # attribute on a sensor named "Log". Found here via
    # selectattr('attributes.eintraege', 'defined') rather than an
    # entity_id pattern -- that attribute name is unique enough to find the
    # sensor reliably regardless of how its entity_id or device name ends
    # up slugified, which an entity_id glob can't guarantee.
    type: panel
    cards:
      - type: markdown
        title: Entscheidungs-Log (jeder Zyklus, alle Geräte)
        card_mod:
          style: >-
            ha-markdown table { width: 100%; border-collapse: collapse; }
            ha-markdown th, ha-markdown td { text-align: left; padding: 4px 10px; border-bottom: 1px solid var(--divider-color); font-size: 13px; }
            ha-markdown th:nth-child(1), ha-markdown td:nth-child(1) { white-space: nowrap; }
            ha-markdown th:nth-child(2), ha-markdown td:nth-child(2) { white-space: nowrap; }
        content: >-
          {% set lsensor = (states.sensor | selectattr('attributes.eintraege', 'defined') | list | first) %}
          {% set eintraege = (state_attr(lsensor.entity_id, 'eintraege') if lsensor else []) or [] %}

          **{{ eintraege | length }} Einträge im Puffer** (neueste zuerst, letzte 200 angezeigt)

          | Datum/Uhrzeit | Gerät | Titel | Details |
          |---|---|---|---|
          {% for e in eintraege[:200] %}| {{ (e.zeit | as_datetime | as_local).strftime('%d.%m. %H:%M:%S') }} | {{ e.wer }} | {{ e.titel }} | {{ e.details }} |
          {% endfor %}
